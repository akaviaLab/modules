# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "rmats_post"
description: MATS is a computational tool to detect differential alternative
  splicing events from RNA-Seq data.
keywords:
  - splicing
  - RNA-Seq
  - alternative splicing
  - exon
  - intron
  - rMATS
tools:
  - "rmats":
      description: "MATS is a computational tool to detect differential alternative
        splicing events from RNA-Seq data."
      homepage: "https://github.com/Xinglab/rmats-turbo"
      documentation: "https://github.com/Xinglab/rmats-turbo/blob/v4.3.0/README.md"
      doi: "10.1038/s41596-023-00944-2"
      licence:
        - "FreeBSD for non-commercial use, see LICENSE file"
      identifier: biotools:rmats

input:
  - - meta:
        type: map
        description: Groovy Map containing experiment information.
    - rmats_files:
        type: file
        description: Multiple rmats files, as outputted by rmats prep. rmats junction count information,
          after processing BAM files.
        pattern: "*.rmats"
        ontologies: []
  - - meta2:
        type: map
        description: Groovy Map containing genome information
    - reference_gtf:
        type: file
        description: Annotation GTF file
        pattern: "*.{gtf}"
        ontologies:
          - edam: http://edamontology.org/format_2306
  - read_length:
      type: integer
      description: Read length in bases
output:
  # TODO nf-core: Update the information obtained from bio.tools and make sure that it is correct
  q-value:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[
            id:'sample1' ]`
      - "*.{}":
          type: file
          description: q-value file
          pattern: "*.{}"
          ontologies:
            - edam: http://edamontology.org/data_3932 # Q-value
  p-value:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[
            id:'sample1' ]`
      - "*.{}":
          type: file
          description: p-value file
          pattern: "*.{}"
          ontologies:
            - edam: http://edamontology.org/data_1669 # P-value
  versions_rmats:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - rmats:
          type: string
          description: The tool name
      - rmats.py --version | sed -e "s/v//g":
          type: eval
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - rmats:
          type: string
          description: The tool name
      - rmats.py --version | sed -e "s/v//g":
          type: eval
          description: The command used to generate the version of the tool
authors:
  - "@akaviaLab"
maintainers:
  - "@akaviaLab"
